name: pokedex
description: "My personal pokedex project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.0.1
  flame: ^1.34.0
  dio: ^5.9.0
  get_it: ^9.2.0
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  web:
    generate: true
    image_path: assets/images/pokedex_icon.png
  image_path: assets/images/pokedex_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/pikachu_running_sprite.png
    - assets/images/pokedex_icon.png

  fonts:
    - family: Roboto
      fonts: 
        - asset: assets/fonts/Roboto/Roboto-VariableFont_wdth,wght.ttf
        - asset: assets/fonts/Roboto/Roboto-Italic-VariableFont_wdth,wght.ttf
          style: italic